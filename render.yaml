# Render.com blueprint for a PRACTICE / TRAINING copy of the portal.
# Creates a free web service and a free PostgreSQL database in the Singapore region.
# See docs/DEMO_DEPLOY.md for the step-by-step guide.
services:
  - type: web
    name: iti-inspection-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh deploy/render_start.sh
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      - key: DJANGO_SSL_REDIRECT
        value: "0"   # Render already redirects http:// to https://
      - key: DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: iti-inspection-demo-db
          property: connectionString

databases:
  - name: iti-inspection-demo-db
    plan: free
    region: singapore
    databaseName: iti_demo
    user: iti_demo
