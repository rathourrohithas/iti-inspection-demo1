{% if page.has_other_pages %}<div class="pager">
{% if page.has_previous %}<a class="btn" href="?{{ qs }}&page={{ page.previous_page_number }}">‹ Previous</a>{% endif %}
<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a class="btn" href="?{{ qs }}&page={{ page.next_page_number }}">Next ›</a>{% endif %}
</div>{% endif %}
